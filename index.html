<style>
/* ===== CORES DO KINVO (medidas nas prints) ===== */
:root{--cyan:#0BCDE6;--cyan2:#08B8E1;--purple:#622DBB;--purple2:#9C4BD6;--lav:#B5A6F7;--orange:#FEA24F;
--bg:#FFFFFF;--bg2:#F3F4F6;--auth:#FAFCFB;--card:#FFFFFF;--text:#090909;--head:#4D5A60;--muted:#7B848A;--line:#E3E7EB;--nav:#F5F6FA;
--pos:#12A150;--neg:#D93A41;--radius:20px}
:root[data-theme=dark]{--bg:#101218;--bg2:#171A22;--auth:#101218;--card:#1B1F2A;--text:#F2F3F7;--head:#D6DBE0;--muted:#98A0AB;--line:#2A2F3C;--nav:#151821;--lav:#3B2F73;--pos:#3DD68C;--neg:#FF7B80;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.4}
#app{max-width:480px;min-height:100%;margin:0 auto;position:relative}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--cyan2);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{width:64px;height:64px;display:block}
.screen{padding:calc(36px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--auth)}
.screen::before{content:"";position:absolute;right:-70%;top:6%;width:140%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,transparent 30%,rgba(120,130,140,.1));pointer-events:none}
.screen>*{position:relative}
.screen form{display:flex;flex-direction:column}
.grow{flex:1}
.eyebrow{color:var(--cyan);font-size:19px;font-weight:500;margin-top:34px}
.h1,.screen h1{font-size:31px;line-height:1.22;font-weight:700;color:var(--head);letter-spacing:-.5px;margin:12px 0 24px}
.screen p.sub{color:var(--muted);margin:-12px 0 20px}
.fld{display:flex;align-items:center;gap:12px;height:64px;padding:0 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin:12px 0 0;font-weight:500;color:var(--head)}
.fld:focus-within{border-color:var(--cyan)}
.fld input{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:17px;font-weight:400;outline:none}
.eye{color:var(--head);display:grid;place-items:center}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px 8px}
.in{width:100%;height:56px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.acts{display:flex;gap:14px;margin-top:auto;padding-top:28px}
.pb{flex:1;display:flex;align-items:center;gap:6px;height:64px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:17px;font-weight:500;color:var(--head)}
.pb .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.pb .ci svg{width:22px;height:22px;stroke-width:2.2}
.pb .pl{flex:1;text-align:center}
.pb:disabled{opacity:.6}
.ci.cy{background:var(--cyan)}.ci.pu{background:var(--purple2)}.ci.gr{background:#B7BDC4}
.btn{width:100%;padding:16px;border-radius:999px;background:var(--purple);color:#fff;font-weight:600;margin-top:18px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.outline{background:transparent;color:var(--purple);border:1.5px solid var(--purple)}
.btn.del{background:transparent;color:var(--neg);border:1.5px solid var(--neg);margin-top:12px}
.link{display:block;margin:20px auto 0;color:var(--head);font-weight:500}
.msg{margin-top:14px;padding:12px 16px;border-radius:16px;font-size:14px;background:rgba(217,58,65,.12);color:var(--neg)}
.msg.ok{background:rgba(18,161,80,.12);color:var(--pos)}
.choice{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.choice button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:16px 22px;border:1px solid var(--line);border-radius:28px;background:var(--card)}
.choice button::after{content:"";width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.choice button.on{background:var(--bg2)}
.choice button.on::after{background:var(--cyan);border-color:var(--cyan);box-shadow:inset 0 0 0 5px var(--bg2)}
.choice b{display:block;font-size:17px;font-weight:600}
.choice span{font-size:13px;color:var(--muted)}
.sep{margin:30px 0 4px;padding-top:22px;border-top:1px solid var(--line);font-weight:600;color:var(--head)}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 0;background:var(--bg)}
.top.gray{background:var(--bg2);padding-bottom:22px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hello{font-size:20px;font-weight:500;line-height:1.25}
.hello.big{font-size:26px;font-weight:600}
.ico{display:flex;gap:2px;margin-right:-8px}
.ico button{width:44px;height:44px;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.tabs{display:flex;margin-top:12px;border-bottom:3px solid var(--line)}
.tabs button{flex:1;padding:14px 4px;font-size:17px;color:var(--muted);margin-bottom:-3px;border-bottom:3px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--purple)}
.month{display:flex;align-items:center;justify-content:space-between;padding:10px 0 0}
.month span{font-weight:600;font-size:17px}
.month button{width:40px;height:40px;border-radius:50%;background:var(--bg2);font-size:22px}
.prof{display:flex;align-items:center;gap:16px;margin:18px 0 18px}
.av{width:64px;height:64px;border-radius:50%;background:#D9DCE1;display:grid;place-items:center;font-weight:600;color:var(--head);font-size:22px;flex:none}
.pn{font-size:20px}
.pv{font-size:17px;margin-top:2px}
main{padding:18px 20px calc(120px + env(safe-area-inset-bottom))}
.hero{background:var(--lav);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.hero .k{color:var(--text);opacity:.7}
.hero h2{font-size:18px;font-weight:600;margin-bottom:6px}
.bal{font-size:34px;font-weight:700;letter-spacing:-.8px;margin-top:2px}
.bal.neg{color:var(--neg)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px}
.two{display:flex;gap:12px;margin-bottom:14px}
.two .card{flex:1;margin:0}
.k{font-size:13px;color:var(--muted)}
.v{font-size:19px;font-weight:700;margin-top:2px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.bar i.over{background:var(--neg)} .bar i.acc{background:var(--purple)}
.row{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.row small{color:var(--muted)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.rows{margin-top:8px}

const pill = (ci, ic, label, attrs) => `<button class="pb" ${attrs}><span class="ci ${ci}">${icon(ic)}</span><span class="pl">${label}</span></button>`;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const KEEP = 5 * 60 * 1000;   // depois de 5 minutos fora do app, pede a digital de novo
const stillOpen = () => { try { const a = +sessionStorage.getItem('away'); return !!a && Date.now() - a < KEEP; } catch { return false; } };
const bioInfo = () => { try { return JSON.parse(load('bio') || 'null'); } catch { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const load = k => { try { return localStorage.getItem(k); } catch { return null; } };
function setTheme(d){ S.dark = d; document.documentElement.dataset.theme = d ? 'dark' : 'light'; store('tema', d ? 'dark' : 'light'); }

const first = d => new Date(d.getFullYear(), d.getMonth(), 1);
const S = { session:null, me:null, partner:null, house:null, settings:null,
            month:first(new Date()), tab:'resumo', view:'casal', tx:[], mode:'casal', authTab:'in', cats:[], subs:[], pms:[], sheet:null, _r:.5, unlocked:stillOpen(),
            hide:load('hide') === '1', dark:load('tema') === 'dark', sub:'resumo', open:null, extra:{}, colls:{}, debts:[], items:[], pays:[], debtErr:'', dopen:{}, msub:'div' };
setTheme(S.dark);
const markAway = () => { if (S.unlocked) try { sessionStorage.setItem('away', String(Date.now())); } catch {} };
addEventListener('pagehide', markAway);
// Instalar o Zelo no celular direto pelo app
let ADD = null;
const isApp = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); ADD = e; if (S.house && S.tab === 'mais') renderShell(); });
addEventListener('appinstalled', () => { ADD = null; toast('Zelo instalado!'); if (S.house) renderShell(); });
async function installApp(){
  if (ADD){
    ADD.prompt(); const r = await ADD.userChoice; ADD = null;
    if (r.outcome === 'accepted') toast('Instalando o Zelo...');
    return renderShell();
  }
  alert(/iphone|ipad|ipod/i.test(navigator.userAgent)
    ? 'No iPhone: toque no botão Compartilhar do Safari e depois em "Adicionar à Tela de Início".'
    : 'Toque nos três pontinhos do Chrome e depois em "Instalar app" (ou "Adicionar à tela inicial"). Se estiver abrindo por dentro do WhatsApp, copie o link e abra no Chrome.');
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return markAway();
  let a = 0; try { a = +sessionStorage.getItem('away') || 0; } catch {}
  if (bioInfo() && S.unlocked && a && Date.now() - a > KEEP){ S.unlocked = false; route(); }
});

function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function monthLabel(){ const t=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(S.month); return t.charAt(0).toUpperCase()+t.slice(1); }
function monthKey(){ const d=S.month; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }
function setMsg(t, ok){ const e=$('#msg'); if(e){ e.className='msg'+(ok?' ok':''); e.textContent=t; } }

// ===== ENTRADA (login / criar conta) =====
sb.auth.onAuthStateChange((ev, session) => {
  const changed = (session?.user?.id) !== (S.session?.user?.id);
  S.session = session;
  if (ev === 'PASSWORD_RECOVERY') return setTimeout(renderRecovery, 0);
  if (ev === 'INITIAL_SESSION' || changed) setTimeout(route, 0);
});

const params = new URLSearchParams(location.search);
if (params.get('convite')) store('convite', params.get('convite'));

async function route(){
  if (!S.session) return load('convite') ? renderSignup(true) : renderAuth();
  const bi = bioInfo();
  if (bi && bi.uid === S.session.user.id && !S.unlocked) return renderLock(bi);
  const { data, error } = await sb.from('members')
    .select('id,display_name,role,household_id,households(id,name,mode)')
    .eq('user_id', S.session.user.id).limit(1);
  if (error) return renderFail(error.message);
  if (!data.length){
    const tk = load('convite'), u = S.session.user.user_metadata || {};
    if (tk){
      const { error:e2 } = await sb.rpc('accept_invite', { p_token:tk, p_display_name:u.nome || u.full_name || u.name || 'Parceiro(a)' });
      if (!e2){ store('convite', ''); history.replaceState(null, '', location.pathname); await saveProfile(); return route(); }
      renderOnboarding(); return setMsg(e2.message);
    }
    return renderOnboarding();
  }
  const m = data[0];
  S.me = { id:m.id, name:m.display_name, role:m.role };
  S.house = m.households;
  const { data:all } = await sb.from('members').select('id,display_name').eq('household_id', S.house.id);
  S.partner = (all || []).find(x => x.id !== S.me.id) || null;
  const { data:ex } = await sb.from('members').select('id,age,sex,marital_status,email').eq('household_id', S.house.id);
  S.extra = Object.fromEntries((ex || []).map(x => [x.id, x]));
  const { data:ph } = await sb.from('members').select('id,photo').eq('household_id', S.house.id);
  (ph || []).forEach(x => { S.extra[x.id] = { ...(S.extra[x.id] || {}), photo:x.photo }; });
  const { data:iv } = await sb.from('invites').select('token,expires_at').eq('household_id', S.house.id).eq('status', 'pendente')
    .gt('expires_at', new Date().toISOString()).order('created_at', { ascending:false }).limit(1);
  S.invite = iv?.[0] || null;
  await loadDebts();
  const { data:st } = await sb.from('settings').select('*').eq('household_id', S.house.id).maybeSingle();
  S.settings = st || { pct_essenciais:55, pct_boleto:30, pct_livre:10, pct_educacao:5 };
  S.view = 'casal';
  const [c, sc, pm] = await Promise.all([
    sb.from('categories').select('id,name,kind,group_key,sort_order,hidden').order('sort_order'),
    sb.from('subcategories').select('id,category_id,name,sort_order,hidden').order('sort_order'),
    sb.from('payment_methods').select('id,name,applies_to,sort_order').order('sort_order')
  ]);
  S.cats = c.data || []; S.subs = sc.data || []; S.pms = pm.data || [];
  await loadMonth();
  renderShell();
}

function renderFail(t){
  $('#app').innerHTML = `<div class="screen"><h1>Algo deu errado</h1><p class="sub">${esc(t)}</p>
  <button class="btn" data-act="retry">Tentar de novo</button><button class="btn ghost" data-act="logout">Sair</button></div>`;
}

function renderAuth(){
  $('#app').innerHTML = `<div class="screen"><div class="brand">${LOGO}<span>Zelo</span></div>
    <div class="eyebrow">Entre no Zelo ou crie uma conta</div>
    <h1 class="h1">Informe seu e-mail de cadastro e senha.</h1>
    <form data-form="auth" class="grow">
      <label class="fld"><span>E-mail:</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="fld"><span>Senha:</span><input id="pw" type="password" autocomplete="current-password" minlength="6" required>
        <button type="button" class="eye" data-act="pw" aria-label="Mostrar senha">${icon('eyeoff')}</button></label>
      <div id="msg"></div>
      <div class="acts">${pill('pu', 'user', 'Criar conta', 'type="button" data-act="signup"')}${pill('cy', 'arrow', 'Entrar', 'type="submit"')}</div>
    </form>
    <button class="link" data-act="forgot">Esqueceu a senha?</button></div>`;
}

function renderSignup(inv){
  const sel = (id, label, list) => `<label class="fld"><span>${label}</span><select id="${id}" required><option value="">Escolher</option>${list.map(x => `<option>${x}</option>`).join('')}</select></label>`;
  $('#app').innerHTML = `<div class="screen">${LOGO}
    <div class="eyebrow">${inv ? 'Você foi convidado(a) para entrar na casa' : 'Crie sua conta'}</div>
    <h1 class="h1">Conte um pouco sobre você.</h1>

// Despesa dos "dois" (sem pessoa) conta metade para cada um nas visões individuais.
function ratioMe(){
  let me = 0, all = 0;
  for (const t of S.tx){
    if (t.subcategories?.categories?.kind !== 'receita') continue;
    all += +t.amount; if (t.member_id === S.me.id) me += +t.amount;
  }
  return all > 0 ? me / all : .5;
}
function share(t){
  const v = +t.amount;
  if (S.view === 'casal') return v;
  const mine = S.view === 'eu', id = mine ? S.me.id : S.partner?.id;
  if (t.member_id === id) return v;
  if (t.member_id !== null) return 0;
  const r = t.split_mode === 'proporcional' ? S._r : .5;
  return v * (mine ? r : 1 - r);
}
function totals(){
  S._r = ratioMe();
  const r = { renda:0, desp:0, g:{ essencial:0, boleto_pessoal:0, livre:0, educacao:0 } };
  for (const t of S.tx){
    const c = t.subcategories?.categories; if (!c) continue;
    const v = share(t);
    if (c.kind === 'receita') r.renda += v; else { r.desp += v; r.g[c.group_key] += v; }
  }
  r.saldo = r.renda - r.desp;
  return r;
}

// Cada anel = um grupo de gastos (ou a renda de uma pessoa), em % da renda do mês.
const nameOf = m => m ? (m.display_name || m.name) : '';
function ringData(){
  const nm = id => S.pms.find(p => p.id === id)?.name, rec = t => t.subcategories?.categories?.kind === 'receita';
  const subIn = l => t => !rec(t) && l.includes(t.subcategories?.name), cat = n => t => !rec(t) && t.subcategories?.categories?.name === n;
  const pes = [S.me, S.partner].filter(Boolean), sexo = m => S.extra[m.id]?.sex;
  const homem = pes.find(m => sexo(m) === 'Masculino') || S.me;
  const mulher = pes.find(m => sexo(m) === 'Feminino' && m !== homem) || (homem === S.me ? S.partner : S.me);
  const pr = (m, c) => ({ n:nameOf(m), c, raw:true, f:t => rec(t) && t.member_id === m.id });
  const defs = [].concat(
    S.partner ? [pr(homem, '#2F6BFF'), pr(mulher, '#F472B6')] : [pr(S.me, sexo(S.me) === 'Feminino' ? '#F472B6' : '#2F6BFF')],
    [{ n:'Investimentos', c:'#22C55E', f:subIn(['METONA', 'METAZONA', 'META']) },
     { n:'Reserva de emergência', c:'#15803D', f:subIn(['METINHA']) },
     { n:'Cartão de crédito', c:'#EF4444', f:t => !rec(t) && nm(t.payment_method_id) === 'Cartão de Crédito' },
     { n:'Mercado', c:'#8B5CF6', f:subIn(['Supermercado', 'Feira']) },
     { n:'Luz, água e internet', c:'#0BCDE6', f:subIn(['Conta de energia', 'Conta de água', 'Celular + TV + internet']) },
     { n:'Transporte', c:'#FB923C', f:cat('Transporte') }, { n:'Saúde', c:'#FACC15', f:cat('Saúde') }, { n:'Dívidas', c:'#94A3B8', f:cat('Dívidas') }]);
  return defs.map(d => {
    const items = {}; let total = 0;
    for (const t of S.tx){ if (!d.f(t)) continue; const v = d.raw ? +t.amount : share(t); if (!v) continue; total += v; const k = t.subcategories?.name; items[k] = (items[k] || 0) + v; }
    return { ...d, total, items };
  }).filter(d => d.total > 0);
}

function ringsHtml(t){
  const rg = ringData(), W = 8, G = 4, poup = t.g.boleto_pessoal, pg = t.renda > 0 ? Math.round(t.desp / t.renda * 100) : 0;
  rg.forEach(r => r.pct = t.renda > 0 ? Math.min(1, r.total / t.renda) : 0);
  const track = rad => `<circle cx="160" cy="160" r="${rad}" fill="none" stroke="var(--line)" stroke-width="${W}"/>`;
  const arcs = rg.length ? rg.slice(0, 8).map((r, i) => {
    const rad = 150 - i * (W + G), C = 2 * Math.PI * rad;
    return track(rad) + (r.pct > 0 ? `<circle cx="160" cy="160" r="${rad}" fill="none" stroke="${r.c}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="${C * r.pct} ${C}" transform="rotate(-90 160 160)"/>` : '');
  }).join('') : [150, 138, 126].map(track).join('');
  return `<div class="rw"><svg class="rsvg" viewBox="0 0 320 320" aria-hidden="true">${arcs}</svg>
    <div class="rc"><span class="mpill">${monthLabel().toUpperCase()}</span><div class="rbal ${t.saldo < 0 ? 'neg' : ''}">${brl(t.saldo)}</div>
      <small>GASTO <b>${pg}%</b> DA RENDA</small><span class="mpill">POUPADO ${brl(poup)}</span></div></div>
  <div class="stats">
    <div><small>RECEITAS</small><b style="color:var(--cyan2)">${brl(t.renda)}</b></div>
    <div><small>DESPESAS</small><b style="color:var(--purple)">${brl(t.desp)}</b></div>
    <div><small>POUPADO</small><b style="color:#F97316">${t.renda > 0 ? (poup / t.renda * 100).toFixed(1).replace('.', ',') : '0'}%</b></div></div>
  <div class="legend">${rg.map(r => `<button class="lg" data-act="ring" data-v="${esc(r.n)}"><i style="background:${r.c}"></i><span>${esc(r.n)}</span><b>${brl(r.total)}</b><small>${Math.round(r.pct * 100)}%</small></button>${S.open === r.n ? `<div class="lgi">${Object.entries(r.items).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><small>${brl(v)}</small></div>`).join('')}</div>` : ''}`).join('')}</div>`;
}

const b64u = t => { const s = (t + '='.repeat((4 - t.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
async function pushOn(){
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window))
      return alert('Este navegador não recebe avisos. Abra o Zelo pelo Chrome e instale o app.');

    const reg = await navigator.serviceWorker.ready;

async function loadDebts(){
  const [a, b, c] = await Promise.all([
    sb.from('debts').select('id,name,note,priority,archived').order('priority'),
    sb.from('debt_items').select('id,debt_id,description,amount,sort_order,paid_out,paid_tx').order('sort_order'),
    sb.from('transactions').select('id,debt_id,amount,date').not('debt_id', 'is', null)]);
  S.debtErr = a.error ? a.error.message : '';
  S.debts = a.data || []; S.items = b.data || []; S.pays = c.data || [];
}
const dbErr = e => /debt|schema cache|does not exist/i.test(e.message) ? 'Rode no Supabase o arquivo etapa1h_supabase.sql.' : e.message;
const fmtIn = n => Number(n).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
function debtCalc(d){
  const its = S.items.filter(i => i.debt_id === d.id);
  const total = its.reduce((a, i) => a + +i.amount, 0);
  const fora = its.filter(i => i.paid_out && !i.paid_tx).reduce((a, i) => a + +i.amount, 0);
  const pago = S.pays.filter(p => p.debt_id === d.id).reduce((a, p) => a + +p.amount, 0);
  const falta = Math.max(0, total - fora - pago), feito = Math.max(0, total - falta);
  return { its, total, falta, feito, pct:total > 0 ? Math.min(100, feito / total * 100) : 0 };
}
function dividasHtml(){
  if (S.debtErr) return `<div class="card empty"><b>Dívidas ainda não ativadas</b>Rode no Supabase o arquivo etapa1h_supabase.sql e atualize o app.</div>`;
  const ds = S.debts.slice().sort((a, b) => (a.priority || 0) - (b.priority || 0)), cs = ds.map(debtCalc);
  const falta = cs.reduce((a, c) => a + c.falta, 0), feito = cs.reduce((a, c) => a + c.feito, 0);
  let h = `<div class="hero"><div class="k">Total a pagar</div><div class="bal">${brl(falta)}</div><div class="k" style="margin-top:4px">Já pago: ${brl(feito)} · ${ds.length} ${ds.length === 1 ? 'dívida' : 'dívidas'}</div></div>

  if (!ds.length) h += `<div class="card empty"><b>Nenhuma dívida anotada</b>Toque em "Nova dívida" para anotar o pedreiro, um empréstimo, o que quiser.<br>Nada daqui entra no orçamento do mês até você pagar.</div>`;
  ds.forEach((d, i) => {

    h += `<div class="card dv" data-id="${d.id}"><div class="dh"><button class="dt" data-act="dtoggle" data-v="${d.id}"><span class="pr">${i + 1}º</span><span class="dn">${esc(d.name)}</span><b>${c.total > 0 && c.falta === 0 ? 'Quitada ✓' : brl(c.falta)}</b></button><button class="ed" data-act="editdebt" data-v="${d.id}" aria-label="Editar dívida">${icon('edit')}</button></div>
      <div class="bar"><i class="acc" style="width:${c.pct}%"></i></div><div class="k">Pago ${brl(c.feito)} de ${brl(c.total)} (${Math.round(c.pct)}%)</div>`;
    if (open){
      if (d.note) h += `<p class="dnote">${esc(d.note)}</p>`;

        return `<button class="ln${pg ? ' pg' : ''}" data-act="edititem" data-v="${it.id}"><span>${pg ? '✓ ' : ''}${esc(it.description)}</span><b>${brl(it.amount)}</b></button>`; }).join('');

const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function addMonths(s, i){
  const [y, m, d] = s.split('-').map(Number), t = new Date(y, m - 1 + i, 1);
  t.setDate(Math.min(d, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
  return ymd(t);
}
function parseMoney(s){
  s = String(s).trim().replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return Math.round(parseFloat(s) * 100) / 100;
}
function fmtDay(s){
  const [y, m, d] = s.split('-').map(Number);
  return new Intl.DateTimeFormat('pt-BR', { weekday:'short', day:'2-digit', month:'short' }).format(new Date(y, m - 1, d));
}

let CR = null;
function handlePhoto(f){
  if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => { CR = { img, z:1, x:0, y:0 }; URL.revokeObjectURL(url); openCrop(); };
  img.onerror = () => toast('Não consegui abrir essa foto.');
  img.src = url;
}
// Desenha a foto no quadro (n = tamanho de saída); x e y são o arrasto, z é o zoom.
function paintCrop(c, n){
  const { img, z } = CR, k = n / 240, base = Math.max(240 / img.width, 240 / img.height) * z, w = img.width * base, h = img.height * base;
  CR.x = Math.max(-(w - 240) / 2, Math.min((w - 240) / 2, CR.x));
  CR.y = Math.max(-(h - 240) / 2, Math.min((h - 240) / 2, CR.y));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, n, n);
  g.drawImage(img, (120 + CR.x - w / 2) * k, (120 + CR.y - h / 2) * k, w * k, h * k);
}
function openCrop(){
  const el = document.createElement('div'); el.id = 'crop';
  el.innerHTML = `<div class="sheet-bg" style="z-index:25;align-items:center"><div class="sheet" style="border-radius:28px;max-width:360px;margin:0 16px;text-align:center">
    <h2>Ajustar foto</h2><p class="k" style="margin:4px 0 14px">Arraste para posicionar e use o controle para aproximar.</p>
    <div class="cw"><canvas id="cv" width="480" height="480"></canvas></div>
    <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" style="width:100%;margin:18px 0 0" aria-label="Zoom">
    <div class="acts">${pill('gr', 'x', 'Cancelar', 'type="button" data-act="cropx"')}${pill('cy', 'check', 'Usar foto', 'type="button" data-act="cropok"')}</div></div></div>`;
  document.body.appendChild(el);
  const cv = $('#cv'); let d = null; paintCrop(cv, 480);
  cv.onpointerdown = e => { d = { x:e.clientX, y:e.clientY, cx:CR.x, cy:CR.y }; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!d) return; CR.x = d.cx + e.clientX - d.x; CR.y = d.cy + e.clientY - d.y; paintCrop(cv, 480); };
  cv.onpointerup = cv.onpointercancel = () => { d = null; };
  $('#zoom').oninput = e => { CR.z = +e.target.value; paintCrop(cv, 480); };
}
function cropDone(ok){
  if (ok && CR){
    const c = document.createElement('canvas'); c.width = c.height = 256; paintCrop(c, 256);
    S.photo = c.toDataURL('image/jpeg', .85);
    $('#pprev').innerHTML = `<img src="${S.photo}" alt="Foto">`;
  }
  CR = null; $('#crop')?.remove();
}

  const TL = { receita_fixa:'Total Receitas Fixas', receita_variavel:'Total Receitas Variáveis', boleto_pessoal:`TOTAL BOLETO PESSOAL (${+st.pct_boleto}%)`,
    essencial:`Total Despesas Essenciais (${+st.pct_essenciais}%)`, educacao:`Total Despesas Educação (${+st.pct_educacao}%)`, livre:`Total Gastos livres (${+st.pct_livre}%)` };
  const tot = (label, v, ed) => `<div class="tot"><span>${label}</span><small>${pc(v, t.renda)}</small><b>${brl(v)}</b>${ed ? `<button class="ed" data-act="pcts" aria-label="Editar porcentagens">${icon('edit')}</button>` : ''}</div>`;
  let h = `<button class="btn ghost" data-act="collall" style="margin:0 0 4px">${Object.keys(S.colls).length ? 'Expandir tudo' : 'Recolher tudo'}</button>`;
  cats.forEach((c, i) => {
    const shut = S.colls[c.id];
    h += `<div class="sh ${shut ? 'c' : ''}"><button class="shb" data-act="cat" data-v="${c.id}"><span class="sn">${esc(c.name.toUpperCase())}</span><small>${pc(cs[c.id], t.renda)}</small><b>${brl(cs[c.id])}</b>${icon('chev')}</button><button class="ed" data-act="editcat" data-v="${c.id}" aria-label="Editar categoria">${icon('edit')}</button></div>`;
    if (!shut){
      h += S.subs.filter(u => u.category_id === c.id && !u.hidden).map(u => {
        const v = sum[u.id] || 0;
        return `<div class="lr"><button class="ln" data-act="line" data-v="${u.id}"><span>${esc(subLabel(u.name))}</span><small>${pc(v, t.renda)}</small><b class="${v ? '' : 'z'}">${v ? brl(v) : '—'}</b></button><button class="ed" data-act="editsub" data-v="${u.id}" aria-label="Editar linha">${icon('edit')}</button></div>`
          + (ent[u.id] || []).map(x => `<button class="en" data-act="edit" data-v="${x.id}"><span>${x.date.slice(8)}/${x.date.slice(5, 7)}${x.notes ? ' · ' + esc(x.notes) : ''}</span><span>${brl(share(x))}</span></button>`).join('');
      }).join('');
      h += `<button class="add" data-act="addsub" data-v="${c.id}">+ Adicionar linha</button>`;
    }
    const nx = cats[i + 1];
    if (!nx || nx.group_key !== c.group_key){
      h += tot(TL[c.group_key], grp[c.group_key], c.kind === 'despesa');
      if (c.group_key === 'receita_variavel') h += tot('Renda Total', t.renda);
    }
  });
  return h + tot('Total Despesas', t.desp) + tot('Saldo Disponível no mês', t.saldo);
}

async function saveTx(){

  if (!x.sub) return setMsg('Escolha o item.');

    split_mode:x.who === 'both' ? x.split : 'nenhum', payment_method_id:x.pm || null, notes:x.nt || null, ...(x.debt ? { debt_id:x.debt } : {}) };
  let error;

  } else {
    const n = Math.max(1, Math.min(60, x.inst || 1)), each = Math.floor(amount / n * 100) / 100, grp = n > 1 ? crypto.randomUUID() : null, rows = [];
    for (let i = 0; i < n; i++){

        date:addMonths(x.dt, i), installment_group:grp, installment_number:n > 1 ? i + 1 : null, installments_total:n > 1 ? n : null });

// Campos de valor: o ponto dos milhares aparece sozinho e a vírgula separa os centavos (1.234,56).
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !('money' in t.dataset)) return;
  let v = t.value.replace(/[^\d.,]/g, '');
  if (e.data === '.' && !v.slice(0, -1).includes(',')) v = v.slice(0, -1) + ',';
  const i = v.indexOf(',');
  let int = (i < 0 ? v : v.slice(0, i)).replace(/\D/g, ''), dec = i < 0 ? null : v.slice(i + 1).replace(/\D/g, '').slice(0, 2);
  int = int.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  t.value = (int || (dec !== null ? '0' : '')) + (dec !== null ? ',' + dec : '');
});

// ===== arrastar as dívidas: segurar e mover para cima ou para baixo =====
let NOCLICK = 0, DR = null;
(function(){
  let t0 = null;
  function place(){
    const d = DR, el = d.el;
    for (let k = 0; k < 8; k++){
      el.style.transform = 'none';
      const r = el.getBoundingClientRect(), cy = d.y - d.grab + r.height / 2;
      const prev = el.previousElementSibling, next = el.nextElementSibling;
      const pr = prev && prev.classList.contains('dv') ? prev.getBoundingClientRect() : null;
      const nx = next && next.classList.contains('dv') ? next.getBoundingClientRect() : null;
      if (pr && cy < pr.top + pr.height / 2){ el.parentNode.insertBefore(el, prev); continue; }
      if (nx && cy > nx.top + nx.height / 2){ el.parentNode.insertBefore(next, el); continue; }
      break;
    }
    el.style.transform = 'none';
    const nat = el.getBoundingClientRect().top;
    el.style.transform = `translateY(${d.y - d.grab - nat}px) scale(1.02)`;
  }
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || S.tab !== 'div') return;
    const el = e.target.closest && e.target.closest('.dv');
    if (!el || e.target.closest('.ln, .acts, .ed')) return;
    const tc = e.touches[0]; t0 = { x:tc.clientX, y:tc.clientY };
    t0.timer = setTimeout(() => {
      DR = { el, y:t0.y, grab:t0.y - el.getBoundingClientRect().top }; t0 = null;
      el.classList.add('drag'); if (navigator.vibrate) navigator.vibrate(25);
      DR.timer = setInterval(() => { if (DR.y < 110) scrollBy(0, -10); else if (DR.y > innerHeight - 150) scrollBy(0, 10); else return; place(); }, 16);
      place();
    }, 380);
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    const tc = e.touches[0];
    if (DR){ e.preventDefault(); DR.y = tc.clientY; place(); return; }
    if (t0 && Math.hypot(tc.clientX - t0.x, tc.clientY - t0.y) > 10){ clearTimeout(t0.timer); t0 = null; }
  }, { passive:false });
  const end = () => {
    if (t0){ clearTimeout(t0.timer); t0 = null; }
    if (!DR) return;
    clearInterval(DR.timer);
    DR.el.classList.remove('drag'); DR.el.style.transform = '';
    const ids = [...document.querySelectorAll('.dv')].map(c => c.dataset.id);
    DR = null; NOCLICK = Date.now() + 400;
    saveOrder(ids); renderShell();
  };
  document.addEventListener('touchend', e => { if (DR) e.preventDefault(); end(); }, { passive:false });
  document.addEventListener('touchcancel', end);
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.dv')) e.preventDefault(); });
})();

// ===== AÇÕES (toques nos botões) =====
document.addEventListener('click', async e => {
  if (Date.now() < NOCLICK) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'sclose'){ if (e.target === b || b.classList.contains('x') || v === 'close') closeSheet(); return; }
  if (a === 'authtab'){ S.authTab = v; renderAuth(); }
  else if (a === 'mode'){ S.mode = v; const dn=$('#dn')?.value, hn=$('#hn')?.value; renderOnboarding(); $('#dn').value=dn||''; $('#hn').value=hn||''; }
  else if (a === 'tab'){ S.tab = v; renderShell(); window.scrollTo(0, 0); }
  else if (a === 'view'){ S.view = v; renderShell(); }
  else if (a === 'prev' || a === 'next'){
    S.month = new Date(S.month.getFullYear(), S.month.getMonth() + (a==='next'?1:-1), 1);
    await loadMonth(); renderShell();
  }
  else if (a === 'fab') openSheet(null);
  else if (a === 'hide'){ S.hide = !S.hide; store('hide', S.hide ? '1' : '0'); renderShell(); }
  else if (a === 'theme'){ setTheme(!S.dark); renderShell(); }
  else if (a === 'help') toast('Central de ajuda: em breve.');
  else if (a === 'pw'){ const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; }
  else if (a === 'signup') renderSignup(false);
  else if (a === 'login') renderAuth();
  else if (a === 'sub'){ S.sub = v; renderShell(); }
  else if (a === 'ring'){ S.open = S.open === v ? null : v; renderShell(); }
  else if (a === 'profile') openProfile();
  else if (a === 'delacc') delAccount();
  else if (a === 'tocasal') setMode('casal');
  else if (a === 'toindiv') setMode('individual');
  else if (a === 'cat'){ if (S.colls[v]) delete S.colls[v]; else S.colls[v] = true; renderShell(); }
  else if (a === 'collall'){ S.colls = Object.keys(S.colls).length ? {} : Object.fromEntries(S.cats.filter(c => !c.hidden).map(c => [c.id, true])); renderShell(); }
  else if (a === 'line') openLine(v);
  else if (a === 'rmphoto'){ S.photo = ''; $('#pprev').textContent = S.me.name.charAt(0).toUpperCase(); }
  else if (a === 'cropx') cropDone(false);
  else if (a === 'cropok') cropDone(true);
  else if (a === 'editsub') editSub(v);
  else if (a === 'editcat') editCat(v);
  else if (a === 'addsub') addSub(v);
  else if (a === 'pcts') openPcts();
  else if (a === 'edel') S.sheet?.edit?.del?.();
  else if (a === 'edit') openSheet(v);
  else if (a === 'skind'){ readForm(); switchKind(v); }
  else if (a === 'sdel') delTx();
  else if (a === 'logout'){ store('convite', ''); store('bio', ''); S.unlocked = false; await sb.auth.signOut(); }
  else if (a === 'unlock') unlock();
  else if (a === 'install') installApp();
  else if (a === 'msub'){ S.msub = v; renderShell(); }
  else if (a === 'newdebt') newDebt();
  else if (a === 'dtoggle'){ S.dopen[v] = !S.dopen[v]; renderShell(); }
  else if (a === 'editdebt') editDebt(v);
  else if (a === 'additem') addItem(v);
  else if (a === 'edititem') editItem(v);
  else if (a === 'paydebt') payDebt(v, null);
  else if (a === 'fx') S.sheet?.form?.extra?.[+v]?.run?.();
  else if (a === 'push'){ if (load('push')) pushOff(); else pushOn(); }
  else if (a === 'bio'){ if (bioInfo()){ store('bio', ''); renderShell(); toast('Digital ou rosto desativado.'); } else bioOn(); }
  else if (a === 'retry') route();
  else if (a === 'forgot'){
    const email = $('#email').value.trim();
    if (!email) return setMsg('Digite seu e-mail primeiro.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    setMsg(error ? ptErr(error.message) : 'Enviamos um link para redefinir a senha no seu e-mail.', !error);
  }
  else if (a === 'invite'){
    b.disabled = true;
    const { data, error } = await sb.rpc('create_invite', { p_household:S.house.id, p_email:null });
    b.disabled = false;
    if (error) return toast(error.message);
    S.invite = { token:data, expires_at:new Date(Date.now() + 864e5).toISOString() };
    $('#invite-out').innerHTML = inviteHtml(data, S.invite.expires_at);
  }
  else if (a === 'copycode'){ try { await navigator.clipboard.writeText(v); toast('Código copiado!'); } catch { toast('Anote o código: ' + v); } }
  else if (a === 'share') shareInvite(v);
  else if (a === 'copy'){
    const v2 = $('#lk').value;
    try { await navigator.clipboard.writeText(v2); toast('Link copiado!'); } catch { $('#lk').select(); toast('Selecione e copie o link.'); }
  }
});

// ===== FORMULÁRIOS =====
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.dataset.form, btn = e.target.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    if (f === 'auth'){
      const email = $('#email').value.trim(), password = $('#pw').value;
      const up = S.authTab === 'up';
      const { data, error } = up ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
      if (error) setMsg(ptErr(error.message));
      else if (up && !data.session) setMsg('Conta criada! Confirme pelo e-mail que enviamos e depois toque em Entrar.', true);
    }
    else if (f === 'recovery'){
      const { error } = await sb.auth.updateUser({ password: $('#pw').value });
      if (error) setMsg(ptErr(error.message)); else { toast('Senha alterada!'); route(); }
    }
    else if (f === 'house'){
      const { error } = await sb.rpc('create_household', { p_name:$('#hn').value, p_mode:S.mode, p_display_name:$('#dn').value });
      if (error) setMsg(error.message); else { await saveProfile(); route(); }
    }
    else if (f === 'tx') await saveTx();
    else if (f === 'signup') await doSignup();
    else if (f === 'profile') await saveProfileForm();
    else if (f === 'edit') await S.sheet.edit.save($('#en').value.trim());
    else if (f === 'pcts') await savePcts();
    else if (f === 'gform') await submitForm();
    else if (f === 'invite'){
      const { error } = await sb.rpc('accept_invite', { p_token:$('#tk').value.trim(), p_display_name:$('#dn2').value });
      if (error) setMsg(error.message); else { store('convite', ''); history.replaceState(null,'',location.pathname); await saveProfile(); route(); }
    }
  } finally { S.authTab = 'in'; if (btn) btn.disabled = false; }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
